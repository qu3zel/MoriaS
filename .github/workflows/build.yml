name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare binary
        run: Copy-Item build/Release/moria.exe build/Release/MoriaS.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moria-x64
          path: build/Release/MoriaS.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/MoriaS.exe
          name: MoriaS ${{ github.ref_name }}
          generate_release_notes: true
